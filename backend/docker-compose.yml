  #     PORT: 3000
  #     NODE_ENV: production
  #     # Inside the Docker network, services reach each other by service
  #     # name (not "localhost") - "mongo" and "minio" below resolve via
  #     # Docker's internal DNS.
  #     MONGO_URI: mongodb://mongo:27017/file-central
  #     JWT_SECRET: ${JWT_SECRET:-change-me-super-secret}
