  #     REFRESH_TOKEN_EXPIRES_IN_DAYS: ${REFRESH_TOKEN_EXPIRES_IN_DAYS:-30}
  #     MINIO_ENDPOINT: minio
  #     MINIO_PORT: 9000
  #     MINIO_USE_SSL: "false"
  #     MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
